<div
  class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-950 dark:to-gray-900"
>
  <!-- Mobile First Layout -->
  <div class="flex flex-col md:flex-row">
    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Main Content -->
    <div class="flex min-w-0 flex-1 flex-col">
      <!-- Navbar -->
      <app-navbar></app-navbar>

      <!-- Page Content -->
      <main class="flex-1 px-4 py-5 sm:px-5 sm:py-6 md:px-6 lg:px-8">
        <!-- Page Header -->
        <section class="mb-6 sm:mb-8">
          <h1
            class="text-3xl font-black tracking-tight bg-gradient-to-r from-gray-900 via-gray-700 to-gray-500 bg-clip-text text-transparent dark:from-white dark:via-gray-200 dark:to-gray-500 sm:text-4xl lg:text-4xl"
          >
            Dashboard
          </h1>

          <p class="mt-2 max-w-2xl text-sm text-gray-500 dark:text-gray-400 sm:text-base">
            Overview of your team's progress and productivity
          </p>
        </section>

        <!-- Stats Grid -->
        <section class="grid grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-5 xl:grid-cols-4">
          <!-- Total Tasks -->
          <div
            class="group rounded-3xl border border-gray-200 bg-white p-5 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl dark:border-gray-800 dark:bg-gray-900"
          >
            <div class="flex items-start justify-between gap-4">
              <div class="min-w-0">
                <p
                  class="text-xs font-semibold uppercase tracking-[0.2em] text-gray-500 dark:text-gray-400"
                >
                  Total Tasks
                </p>

                <h2
                  class="mt-3 text-4xl font-black tracking-tight text-gray-900 dark:text-white sm:text-5xl"
                >
                  {{ totalTasks }}
                </h2>
              </div>

              <div
                class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-blue-500/10 transition-transform duration-300 group-hover:scale-110"
              >
                <svg lucideClipboardList class="h-7 w-7 text-blue-500"></svg>
              </div>
            </div>

            <div class="mt-5 h-1.5 rounded-full bg-blue-500"></div>
          </div>

          <!-- Completed -->
          <div
            class="group rounded-3xl border border-gray-200 bg-white p-5 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl dark:border-gray-800 dark:bg-gray-900"
          >
            <div class="flex items-start justify-between gap-4">
              <div class="min-w-0">
                <p
                  class="text-xs font-semibold uppercase tracking-[0.2em] text-gray-500 dark:text-gray-400"
                >
                  Completed
                </p>

                <h2
                  class="mt-3 text-4xl font-black tracking-tight text-gray-900 dark:text-white sm:text-5xl"
                >
                  {{ completedTasks }}
                </h2>
              </div>

              <div
                class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-green-500/10 transition-transform duration-300 group-hover:scale-110"
              >
                <svg lucideCheckCircle class="h-7 w-7 text-green-500"></svg>
              </div>
            </div>

            <div class="mt-5 h-1.5 rounded-full bg-green-500"></div>
          </div>

          <!-- Pending -->
          <div
            class="group rounded-3xl border border-gray-200 bg-white p-5 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl dark:border-gray-800 dark:bg-gray-900"
          >
            <div class="flex items-start justify-between gap-4">
              <div class="min-w-0">
                <p
                  class="text-xs font-semibold uppercase tracking-[0.2em] text-gray-500 dark:text-gray-400"
                >
                  Pending
                </p>

                <h2
                  class="mt-3 text-4xl font-black tracking-tight text-gray-900 dark:text-white sm:text-5xl"
                >
                  {{ pendingTasks }}
                </h2>
              </div>

              <div
                class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-yellow-500/10 transition-transform duration-300 group-hover:scale-110"
              >
                <svg lucideClock class="h-7 w-7 text-yellow-500"></svg>
              </div>
            </div>

            <div class="mt-5 h-1.5 rounded-full bg-yellow-500"></div>
          </div>

          <!-- In Progress -->
          <div
            class="group rounded-3xl border border-gray-200 bg-white p-5 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl dark:border-gray-800 dark:bg-gray-900"
          >
            <div class="flex items-start justify-between gap-4">
              <div class="min-w-0">
                <p
                  class="text-xs font-semibold uppercase tracking-[0.2em] text-gray-500 dark:text-gray-400"
                >
                  In Progress
                </p>

                <h2
                  class="mt-3 text-4xl font-black tracking-tight text-gray-900 dark:text-white sm:text-5xl"
                >
                  {{ inProgressTasks }}
                </h2>
              </div>

              <div
                class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-violet-500/10 transition-transform duration-300 group-hover:scale-110"
              >
                <svg lucideLoader2 class="h-7 w-7 text-violet-500"></svg>
              </div>
            </div>

            <div class="mt-5 h-1.5 rounded-full bg-violet-500"></div>
          </div>
        </section>
      </main>
    </div>
  </div>
</div>
