<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-950 dark:to-gray-900 p-4"
>
  <div
    class="w-full max-w-md bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-xl p-6 transition-all duration-200"
  >
    <!-- Logo/Icon Area -->
    <div class="flex justify-center mb-5">
      <div
        class="w-14 h-14 bg-gradient-to-br from-blue-600 to-blue-700 rounded-xl flex items-center justify-center shadow-md"
      >
        <svg lucideZap class="w-7 h-7 text-white"></svg>
      </div>
    </div>

    <!-- Title -->
    <h2 class="text-2xl font-bold text-center text-gray-900 dark:text-white mb-1">Welcome Back</h2>

    <p class="text-center text-gray-500 dark:text-gray-400 text-sm mb-6">Sign in to your account</p>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Email Field -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
          Email Address
        </label>

        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg lucideMail class="h-4 w-4 text-gray-400"></svg>
          </div>

          <input
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            class="w-full pl-9 pr-3 py-2.5 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200"
            [class.border-red-500]="
              loginForm.get('email')?.invalid && loginForm.get('email')?.touched
            "
          />
        </div>

        @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
          <p class="mt-1.5 text-xs text-red-500 font-medium">Please enter a valid email</p>
        }
      </div>

      <!-- Password Field -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
          Password
        </label>

        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg lucideLock class="h-4 w-4 text-gray-400"></svg>
          </div>

          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            class="w-full pl-9 pr-10 py-2.5 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200"
            [class.border-red-500]="
              loginForm.get('password')?.invalid && loginForm.get('password')?.touched
            "
          />

          <!-- Show/Hide Password Toggle -->
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 pr-3 flex items-center"
          >
            @if (!showPassword) {
              <svg
                lucideEye
                class="h-4 w-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"
              ></svg>
            } @else {
              <svg
                lucideEyeOff
                class="h-4 w-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"
              ></svg>
            }
          </button>
        </div>

        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <p class="mt-1.5 text-xs text-red-500 font-medium">Password is required</p>
        }
      </div>

      <!-- Forgot Password Link -->
      <div class="text-right">
        <a
          href="/forgot-password"
          class="text-xs text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
        >
          Forgot password?
        </a>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl shadow-sm hover:shadow-md transform hover:scale-[1.01] active:scale-[0.98] transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 text-sm"
      >
        @if (loading) {
          <div class="flex items-center justify-center gap-2">
            <svg lucideLoader2 class="animate-spin h-4 w-4 text-white"></svg>
            <span>Signing in...</span>
          </div>
        } @else {
          <span>Sign In</span>
        }
      </button>

      <!-- Sign up link -->
      <div class="text-center pt-2">
        <p class="text-xs text-gray-500 dark:text-gray-400">
          Don't have an account?
          <a
            routerLink="/register"
            class="text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 font-semibold transition-colors"
          >
            Sign up
          </a>
        </p>
      </div>
    </form>
  </div>
</div>
