<!-- Mobile Menu Button -->
<button
  type="button"
  (click)="isSidebarOpen = true"
  class="fixed left-4 top-4 z-[60] flex h-11 w-11 items-center justify-center rounded-xl border border-gray-200 bg-white text-gray-700 shadow-sm transition-all hover:scale-105 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100 md:hidden"
  aria-label="Open sidebar"
>
  <svg lucideMenu class="h-5 w-5"></svg>
</button>

<!-- Backdrop -->
@if (isSidebarOpen) {
  <div
    class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm transition-opacity md:hidden"
    (click)="isSidebarOpen = false"
  ></div>
}

<!-- Sidebar -->
<aside
  class="fixed left-0 top-0 z-[60] flex h-screen w-[86%] max-w-[320px] flex-col border-r border-gray-200 bg-white shadow-xl transition-transform duration-300 ease-out dark:border-gray-800 dark:bg-gray-950 md:static md:w-72 md:translate-x-0 md:shadow-none"
  [class.translate-x-0]="isSidebarOpen"
  [class.-translate-x-full]="!isSidebarOpen"
>
  <!-- Header -->
  <div class="border-b border-gray-200 px-5 py-5 dark:border-gray-800">
    <div class="flex items-start justify-between gap-3">
      <!-- Brand -->
      <a routerLink="/" class="flex items-center gap-3 transition-all hover:opacity-80">
        <div class="flex h-10 items-center justify-center rounded-xl">
          <img src="tmhq.png" alt="TaskManagerHQ Logo" class="h-full w-full object-cover" />
        </div>

        <div>
          <h1 class="text-xl font-bold tracking-tight text-gray-900 dark:text-white">
            TaskManagerHQ
          </h1>
          <p
            class="mt-0.5 text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400"
          >
            Team Productivity
          </p>
        </div>
      </a>

      <!-- Close -->
      <button
        type="button"
        (click)="isSidebarOpen = false"
        class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-100 text-gray-500 transition-all hover:bg-gray-200 hover:text-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-gray-200 md:hidden"
        aria-label="Close sidebar"
      >
        <svg lucideX class="h-5 w-5"></svg>
      </button>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto px-3 py-6">
    <div class="space-y-1">
      <!-- Dashboard -->
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-blue-50 text-blue-700 dark:bg-blue-500/10 dark:text-blue-400"
        (click)="isSidebarOpen = false"
        class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-gray-700 transition-all hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
      >
        <div
          class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-100 text-gray-600 transition-all group-hover:bg-blue-500/10 dark:bg-gray-800 dark:text-gray-400"
        >
          <svg lucideLayoutDashboard class="h-5 w-5"></svg>
        </div>

        <div class="min-w-0">
          <p class="truncate text-sm font-semibold">Dashboard</p>
          <p class="text-xs text-gray-500 dark:text-gray-400">Overview & analytics</p>
        </div>
      </a>

      <!-- Tasks -->
      <a
        routerLink="/tasks"
        routerLinkActive="bg-blue-50 text-blue-700 dark:bg-blue-500/10 dark:text-blue-400"
        (click)="isSidebarOpen = false"
        class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-gray-700 transition-all hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
      >
        <div
          class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-100 text-gray-600 transition-all group-hover:bg-green-500/10 dark:bg-gray-800 dark:text-gray-400"
        >
          <svg lucideCheckSquare class="h-5 w-5"></svg>
        </div>

        <div class="min-w-0">
          <p class="truncate text-sm font-semibold">Tasks</p>
          <p class="text-xs text-gray-500 dark:text-gray-400">Manage team tasks</p>
        </div>
      </a>

      <!-- Users -->
      @if (user?.role === 'MANAGER') {
        <a
          routerLink="/users"
          routerLinkActive="bg-blue-50 text-blue-700 dark:bg-blue-500/10 dark:text-blue-400"
          (click)="isSidebarOpen = false"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-gray-700 transition-all hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
        >
          <div
            class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-100 text-gray-600 transition-all group-hover:bg-violet-500/10 dark:bg-gray-800 dark:text-gray-400"
          >
            <svg lucideUsers class="h-5 w-5"></svg>
          </div>

          <div class="min-w-0">
            <p class="truncate text-sm font-semibold">Users</p>
            <p class="text-xs text-gray-500 dark:text-gray-400">Manage team members</p>
          </div>
        </a>
      }
    </div>
  </nav>

  <!-- Footer -->
  <div
    class="border-t border-gray-200 px-5 py-4 text-center text-xs text-gray-500 dark:border-gray-800 dark:text-gray-400"
  >
    Built for productive teams
  </div>
</aside>
