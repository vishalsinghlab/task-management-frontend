<!-- Mobile Menu Button -->
<button
  type="button"
  (click)="isSidebarOpen = true"
  class="fixed left-4 top-4 z-[60] flex h-11 w-11 items-center justify-center rounded-2xl border border-gray-200 bg-white text-gray-700 shadow-lg transition-all duration-200 hover:scale-105 hover:shadow-xl dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100 md:hidden"
  aria-label="Open sidebar"
>
  <svg lucideMenu class="h-5 w-5"></svg>
</button>

<!-- Backdrop -->
@if (isSidebarOpen) {
  <div
    class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm transition-opacity md:hidden"
    (click)="isSidebarOpen = false"
  ></div>
}

<!-- Sidebar -->
<aside
  class="fixed left-0 top-0 z-[60] flex h-screen w-[86%] max-w-[320px] flex-col border-r border-gray-800 bg-gray-950 text-white shadow-2xl transition-transform duration-300 ease-out md:static md:w-72 md:translate-x-0 md:shadow-none"
  [class.translate-x-0]="isSidebarOpen"
  [class.-translate-x-full]="!isSidebarOpen"
>
  <!-- Header -->
  <div class="border-b border-gray-800/70 px-5 py-5">
    <div class="flex items-start justify-between gap-3">
      <!-- Brand -->
      <div class="flex items-center gap-3">
        <div
          class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-500 via-blue-600 to-violet-600 shadow-lg shadow-blue-500/20"
        >
          <svg lucideZap class="h-6 w-6 text-white"></svg>
        </div>

        <div>
          <h1
            class="bg-gradient-to-r from-blue-400 via-blue-500 to-violet-500 bg-clip-text text-2xl font-black tracking-tight text-transparent"
          >
            TaskFlow
          </h1>

          <p class="mt-0.5 text-[11px] font-semibold uppercase tracking-[0.16em] text-gray-500">
            Team Productivity
          </p>
        </div>
      </div>

      <!-- Close -->
      <button
        type="button"
        (click)="isSidebarOpen = false"
        class="flex h-10 w-10 items-center justify-center rounded-2xl bg-gray-900 text-gray-400 transition-all duration-200 hover:bg-gray-800 hover:text-white md:hidden"
        aria-label="Close sidebar"
      >
        <svg lucideX class="h-5 w-5"></svg>
      </button>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto px-3 py-5">
    <div class="space-y-2">
      <!-- Dashboard -->
      <a
        routerLink="/dashboard"
        routerLinkActive="sidebar-link-active"
        (click)="isSidebarOpen = false"
        class="group flex items-center gap-3 rounded-2xl px-3 py-3 text-gray-300 transition-all duration-200 hover:bg-gray-900 hover:text-white"
      >
        <div
          class="flex h-11 w-11 items-center justify-center rounded-xl bg-gray-900 transition-all duration-200 group-hover:bg-blue-500/10"
        >
          <svg lucideLayoutDashboard class="h-5 w-5"></svg>
        </div>

        <div class="min-w-0">
          <p class="truncate text-sm font-semibold">Dashboard</p>
          <p class="text-xs text-gray-500">Overview & analytics</p>
        </div>
      </a>

      <!-- Tasks -->
      <a
        routerLink="/tasks"
        routerLinkActive="sidebar-link-active"
        (click)="isSidebarOpen = false"
        class="group flex items-center gap-3 rounded-2xl px-3 py-3 text-gray-300 transition-all duration-200 hover:bg-gray-900 hover:text-white"
      >
        <div
          class="flex h-11 w-11 items-center justify-center rounded-xl bg-gray-900 transition-all duration-200 group-hover:bg-green-500/10"
        >
          <svg lucideCheckSquare class="h-5 w-5"></svg>
        </div>

        <div class="min-w-0">
          <p class="truncate text-sm font-semibold">Tasks</p>
          <p class="text-xs text-gray-500">Manage team tasks</p>
        </div>
      </a>

      <!-- Users -->
      @if (user?.role === 'MANAGER') {
        <a
          routerLink="/users"
          routerLinkActive="sidebar-link-active"
          (click)="isSidebarOpen = false"
          class="group flex items-center gap-3 rounded-2xl px-3 py-3 text-gray-300 transition-all duration-200 hover:bg-gray-900 hover:text-white"
        >
          <div
            class="flex h-11 w-11 items-center justify-center rounded-xl bg-gray-900 transition-all duration-200 group-hover:bg-violet-500/10"
          >
            <svg lucideUsers class="h-5 w-5"></svg>
          </div>

          <div class="min-w-0">
            <p class="truncate text-sm font-semibold">Users</p>
            <p class="text-xs text-gray-500">Manage team members</p>
          </div>
        </a>
      }
    </div>
  </nav>

  <!-- Footer -->
  <div class="border-t border-gray-800/70 px-5 py-4 text-center text-xs text-gray-500">
    Built for productive teams
  </div>
</aside>
