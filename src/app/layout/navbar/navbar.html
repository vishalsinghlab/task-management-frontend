<header
  class="sticky top-0 z-50 border-b border-gray-200 dark:border-gray-800 bg-white/90 dark:bg-gray-950/90 backdrop-blur-xl"
>
  <div class="px-4 py-3 sm:px-6 lg:px-8">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <!-- Top Section -->
      <div class="flex items-start justify-between gap-4">
        <!-- Logo and Icon -->
        <div class="flex items-center gap-3">
          <div
            class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-500 via-blue-600 to-violet-600 shadow-lg shadow-blue-500/20"
          >
            <svg lucideZap class="h-6 w-6 text-white"></svg>
          </div>

          <div class="min-w-0">
            <h1
              class="truncate text-2xl font-black tracking-tight bg-gradient-to-r from-blue-600 via-violet-600 to-purple-600 bg-clip-text text-transparent sm:text-3xl"
            >
              TaskFlow
            </h1>

            <p
              class="mt-1 text-xs font-medium tracking-wide text-gray-500 dark:text-gray-400 sm:text-sm"
            >
              Smart Team Management
            </p>
          </div>
        </div>

        <!-- Mobile Theme Toggle -->
        <button
          type="button"
          (click)="toggleTheme()"
          class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-gray-200 bg-white text-lg shadow-sm transition-all hover:scale-105 hover:bg-gray-50 active:scale-95 dark:border-gray-700 dark:bg-gray-900 dark:hover:bg-gray-800 sm:hidden"
          [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          <svg lucideSunMoon class="h-5 w-5"></svg>
        </button>
      </div>

      <!-- Actions -->
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-end">
        <!-- User Card -->
        @if (user) {
          <div
            class="flex items-center justify-between rounded-2xl border border-gray-200 bg-white px-4 py-3 shadow-sm dark:border-gray-800 dark:bg-gray-900 sm:min-w-[220px]"
          >
            <div class="flex items-center gap-3 min-w-0">
              <div
                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-blue-500 to-violet-500"
              >
                <svg lucideUser class="h-5 w-5 text-white"></svg>
              </div>

              <div class="min-w-0">
                <p
                  class="truncate text-sm font-semibold text-gray-900 dark:text-white sm:text-base"
                >
                  {{ user.username }}
                </p>

                <p
                  class="mt-0.5 text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400"
                >
                  {{ user.role }}
                </p>
              </div>
            </div>

            <!-- Desktop Theme Toggle -->
            <button
              type="button"
              (click)="toggleTheme()"
              class="ml-3 hidden h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-gray-200 bg-gray-50 text-base transition-all hover:scale-105 hover:bg-gray-100 active:scale-95 dark:border-gray-700 dark:bg-gray-800 dark:hover:bg-gray-700 sm:inline-flex"
              [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
            >
              @if (!isDarkMode()) {
                <svg lucideMoon class="h-5 w-5 text-gray-700"></svg>
              } @else {
                <svg lucideSun class="h-5 w-5 text-gray-300"></svg>
              }
            </button>
          </div>
        }

        <!-- Logout -->
        <button
          type="button"
          (click)="logout()"
          class="inline-flex h-11 items-center justify-center gap-2 rounded-xl bg-red-500 px-5 text-sm font-semibold text-white shadow-sm transition-all hover:scale-[1.02] hover:bg-red-600 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 dark:focus:ring-offset-gray-950 sm:h-12 sm:px-6 sm:text-base"
          aria-label="Logout"
        >
          <svg lucideLogOut class="h-4 w-4 sm:h-5 sm:w-5"></svg>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>
</header>
