<header
  class="sticky top-0 z-50 border-b border-gray-200 bg-white/80 backdrop-blur-md dark:border-gray-800 dark:bg-gray-950/80"
>
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between gap-3">
      <!-- LEFT -->
      <div class="flex min-w-0 items-center gap-3">
        <!-- Logo -->
        <a
          routerLink="/"
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-blue-600 to-blue-700 shadow-sm transition-all hover:scale-105 hover:shadow-md"
        >
          <svg lucideZap class="h-5 w-5 text-white"></svg>
        </a>

        <!-- Brand -->
        <a routerLink="/" class="min-w-0 transition-opacity hover:opacity-80">
          <h1
            class="truncate text-base font-bold tracking-tight text-gray-900 dark:text-white sm:text-lg"
          >
            TaskFlow
          </h1>

          <p class="hidden text-xs text-gray-500 dark:text-gray-400 sm:block">
            Smart Team Management Platform
          </p>
        </a>
      </div>

      <!-- RIGHT -->
      <div class="flex shrink-0 items-center gap-2 sm:gap-3">
        @if (user) {
          <!-- User Card -->
          <div
            class="flex items-center gap-2 rounded-xl border border-gray-200 bg-white px-2 py-1.5 shadow-sm dark:border-gray-800 dark:bg-gray-900 sm:px-3 sm:py-2"
          >
            <!-- Avatar -->
            <div
              class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-gradient-to-br from-blue-600 to-blue-700 text-white"
            >
              <svg lucideUser class="h-4 w-4"></svg>
            </div>

            <!-- Info -->
            <div class="hidden min-w-0 sm:block">
              <p class="truncate text-sm font-semibold text-gray-900 dark:text-white">
                {{ user.username }}
              </p>

              <p
                class="truncate text-[10px] font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400"
              >
                {{ user.role }}
              </p>
            </div>
          </div>
        }

        <!-- Theme Toggle -->
        <button
          type="button"
          (click)="toggleTheme()"
          class="cursor-pointer inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-gray-200 bg-white shadow-sm transition-colors hover:bg-gray-50 active:scale-95 dark:border-gray-700 dark:bg-gray-900 dark:hover:bg-gray-800"
          [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          @if (!isDarkMode()) {
            <svg lucideMoon class="h-4 w-4 text-gray-700"></svg>
          } @else {
            <svg lucideSun class="h-4 w-4 text-yellow-500"></svg>
          }
        </button>

        <!-- Logout -->
        <button
          type="button"
          (click)="logout()"
          class="cursor-pointer inline-flex h-9 items-center justify-center gap-2 rounded-xl bg-red-500 px-3 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 dark:focus:ring-offset-gray-950 sm:px-4"
          aria-label="Logout"
        >
          <svg lucideLogOut class="h-4 w-4"></svg>

          <span class="hidden sm:inline"> Logout </span>
        </button>
      </div>
    </div>
  </div>
</header>
